[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-intelligence"
version = "2.0.0"
description = "Sales analytics, demand forecasting and recommendations on 1M real retail transactions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "duckdb>=1.1",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "joblib>=1.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "jupyter", "matplotlib>=3.8"]

[project.scripts]
retail = "retail.__main__:main"

[tool.setuptools]
packages = ["retail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
