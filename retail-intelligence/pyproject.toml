[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "openpyxl>=3.1,<4", "duckdb>=1.1,<2", "scikit-learn>=1.5,<2", "joblib>=1.3,<2", "scipy>=1.12,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["httpx"]
notebooks = ["nbformat", "nbclient", "ipykernel", "matplotlib"]

[tool.setuptools]
packages = ["retail"]
